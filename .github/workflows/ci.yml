name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          # Dummy values for manifest loading (unit tests don't make actual API calls)
          OPENAI_API_KEY: dummy-key-for-manifest-loading
          ANTHROPIC_API_KEY: dummy-key-for-manifest-loading
          OPENROUTER_API_KEY: dummy-key-for-manifest-loading
          GOOGLE_API_KEY: dummy-key-for-manifest-loading

      - name: Test Extensions
        run: npm run test:extensions
        env:
          # Dummy values for manifest loading (unit tests don't make actual API calls)
          OPENAI_API_KEY: dummy-key-for-manifest-loading
          ANTHROPIC_API_KEY: dummy-key-for-manifest-loading
          OPENROUTER_API_KEY: dummy-key-for-manifest-loading
          GOOGLE_API_KEY: dummy-key-for-manifest-loading

